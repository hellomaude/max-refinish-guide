strongest_counter: >-
  The cluster is real on the count and false on the mechanism. Eight SBLK
  insiders reported buying 244,800 shares on 2026-09-15, every one of them at
  exactly $28.27. That price is EUR 24.50: the offering price of Star Bulk's
  Greek public offering of 4.4 million new shares, settled on September 15 and
  listed on Euronext Athens on September 16. The co-CFO's own filing describes
  the purchase as made "at an offering price of EUR 24.50" in the parallel
  offering in Greece; a director's filing says the same. So these are
  allocations in the company's own primary offering, not open-market purchases:
  the price was set by the bookrunner, the date was set by the settlement
  timetable, the participation was disclosed on September 4 before the book
  opened (the CEO's family interest was announced at up to EUR 6.0 million),
  and the book was six times oversubscribed. Nasdaq closed at $31.21 on the
  same September 15, so the insiders "bought" 9.4 percent below the market that
  day. An insider-buying cluster carries information because insiders chose the
  price, the timing and the exposure with their own money against the market.
  Here they chose none of the three, and taking up a pre-announced allocation at
  a discount in a home-market listing is what a chief executive does to make
  the listing succeed, not a bet on the freight cycle. The ticket's own
  invalidation is aimed at the wrong failure: it screens for grants and
  exercises (codes A and M), but these filings will almost certainly carry code
  P, so Shadow's adapter counting distinct code-P owners will confirm a cluster
  that does not mean what the ticket says a cluster means. A thesis whose
  defining evidence is a different kind of transaction from the one it names is
  broken, not optimistic.

what_would_change_my_mind: >-
  Shadow pulls the eight Form 4s from EDGAR (the desk box can reach sec.gov;
  this session could not) and finds any two distinct reporting owners with a
  code-P purchase on Nasdaq, dated other than 2026-09-15, at a price that is
  not $28.27, with no footnote referencing the Greek offering. Two such buys at
  or above the $31-32 market price since the listing and I withdraw the kill
  and re-file as a contest. Alternatively, the filings' footnotes state the
  September 15 purchases were open-market executions that merely coincided with
  the offering price, which I would treat as settling it the other way.

missed_invalidation: >-
  The ticket names no exit for a stock that has already moved. SBLK closed at
  $32.48 on 2026-09-18 against a 52-week high of $32.88 and a 52-week low of
  $16.72; the insider price is $28.27. Even if the signal were real, the desk
  would be buying 15 percent above where the insiders bought, and the ticket
  should say what price makes the insider read irrelevant. It also carries no
  invalidation for the primary-offering case at all.

evidence_disputed: []

notes: >-
  Not disputing: the count. Eight distinct reporting owners is more than the
  "one director's four filings" failure the ticket worried about, and the
  aggregator did not double-count. The ticket set itself the wrong test and
  passed it.

  The -4 is for the score record, not the engine: the kill fails the ticket
  regardless. The insider signal as filed contributes zero. What remains is
  that executives put roughly $6.9 million of their own money into a discounted
  allocation they had pre-announced, which is sentiment, and the desk may not
  originate on sentiment alone.

