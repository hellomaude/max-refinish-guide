strongest_counter: >-
  The gate resolved in the author's favour and the ticket still expired. BTC
  held the $81.3k reclaim into Monday's cash open on 2026-09-21 and ran to
  $87k; the intraday horizon the ticket names was that session, and it is
  gone. The thing the desk would now be buying is not "continuation off the
  Monday reclaim" but a chase two sessions later, with an invalidation, BTC
  losing $80k, that sits 7 percent below spot: on an intraday horizon that is
  not a stop, it is a hope, and the conviction ladder converts stop distance
  into size, so the ticket as written asks for intraday sizing on a swing
  stop. The deeper problem is the mechanism. COIN's move was Friday's, not
  Monday's: it closed 2026-09-18 up 11.7 percent at $194.25 on the SEC's
  September 17 tokenized-securities exemption, a regulatory event BTC's
  price does not carry. On Monday, with BTC up roughly 6-7 percent from its
  Sunday open, COIN closed up 3.5 percent at $201.05, a realised beta near
  0.5, and on Tuesday it traded $197-203 while BTC held $86k. The equity had
  already priced its catalyst before the BTC gate was tested, so "BTC holds,
  therefore COIN continues" is a conditional whose antecedent came true and
  whose consequent did not follow at the beta the pairing assumes. A ticket
  gated on BTC is a ticket about BTC; if the desk wants BTC, WKND-005 already
  draws on the same theme cap, and this leg adds venue risk (equity is
  disabled) and a lower beta for the same factor exposure.

what_would_change_my_mind: >-
  Chain or Wire re-files with a horizon and a stop that agree: either an
  intraday horizon with a COIN-level invalidation inside the session's range,
  or a swing horizon that states the overnight exposure so Rails can apply the
  event windows. Then a beta read from a named source: if COIN's 20-day
  realised beta to BTC, from a page the desk can cite with a date, is above
  1.0, the pairing argument fails and I concede to zero. A beta below 0.7
  keeps the contest whatever the tape does.

missed_invalidation: >-
  A COIN-specific exit for the regulatory catalyst unwinding. The Friday gap
  was the SEC exemption; the level that says the market is giving that gap
  back is the September 18 close at $194.25, and it belongs in the ticket
  regardless of BTC.

