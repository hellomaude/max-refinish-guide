strongest_counter: >-
  HOOD does not express a BTC continuation, and its own numbers say so. In
  the quarter ended 2026-06-30 Robinhood's crypto transaction revenue was
  $100 million on total net revenues of $1.31 billion, about 7.6 percent, down
  38 percent year on year, and smaller than its $156 million from prediction
  markets; options were $342 million and equities $129 million. A name whose
  crypto line is one dollar in thirteen is a retail-activity and rates story
  with a crypto flavour, not a BTC beta, and the tape agreed: on Monday
  2026-09-21, with BTC up roughly 6-7 percent from its Sunday open, HOOD
  closed up about 3 percent against an S&P 500 up 1.5 percent, and on Tuesday
  it rose 2.9 percent to $123.30 on a session where BTC was flat near $86k.
  That is an equity beta to a strong tape, not a crypto beta to a squeeze.
  Pairing it with COIN as one "continuation" leg gated on BTC holding $81.3k
  gives the desk two problems: the gate does not govern HOOD's return, and
  the combined cap treats two instruments with roughly a 2:1 difference in
  realised BTC sensitivity as one exposure, so the cap is either too tight for
  COIN or too loose for HOOD depending on which leg fills. Add the COIN
  objections, which carry over whole: the intraday horizon was Monday and has
  passed, the $80k BTC invalidation is 7 percent below spot and is not an
  intraday stop, and the Friday move (HOOD up 9.1 percent to $119.82 on
  2026-09-18) was the SEC exemption, priced before the BTC gate was tested. A
  thesis about BTC should not be routed through the instrument in the theme
  with the least BTC in it.

what_would_change_my_mind: >-
  A dated, cited beta: HOOD's 20-day realised beta to BTC above 1.0 from a
  source the desk can name, or Chain and Wire restating the HOOD leg on its
  actual drivers (retail options and equities volume, prediction-market
  revenue, rates) with an invalidation in those terms rather than a BTC level.
  Either and I move to a -1 contest on the horizon problem alone; a beta
  below 0.7 and the -2 stands.

missed_invalidation: >-
  HOOD's own reclaim level. The ticket names "the prior session's reclaim
  level" without a number; the September 18 close of $119.82 is the level at
  which the regulatory gap is being given back, and it should be written down.
  There is also no invalidation tied to HOOD's real drivers, so the position
  could be wrong for HOOD reasons without any BTC level being hit.

