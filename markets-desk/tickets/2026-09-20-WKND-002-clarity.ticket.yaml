thesis: >-
  The weekend pack carried this as a Yes at ~7.55c. That side is not mispriced,
  it is nearly dead. Senate cloture on the motion to proceed to H.R.3633 failed
  on 2026-09-15 at 50-49, ten votes short of the 60 needed, with seven of the
  Democrats who negotiated the bill voting no. Market-structure work in the
  Senate is finished for the session. The residual path to a signature before
  year end requires a lame-duck revival, a new cloture attempt, floor time in a
  chamber that has none, and a House-Senate reconciliation — compounding to low
  single digits, below the 7.55c the Yes side still carries. The edge, if any,
  is on No as short-dated carry, not on Yes as a lottery ticket.

catalyst: >-
  Absence of a catalyst is the thesis: each week without a re-filed cloture
  motion decays Yes toward zero. Watch for a discharge attempt or an
  attachment to the year-end NDAA or approps vehicle.
catalyst_at: 2026-12-31T21:00:00-08:00

invalidation: >-
  Any re-filed cloture motion on H.R.3633, or the text being attached to a
  must-pass year-end vehicle. Either one reprices No violently and the carry
  is not worth defending — exit, do not average.

