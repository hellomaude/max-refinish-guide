thesis: >-
  The weekend pack carried this as a Yes at ~7.55c. That side is not mispriced,
  it is nearly dead. Cloture on the motion to proceed to H.R.3633 failed 49-50
  on 2026-09-15 (Roll Call 234), eleven short of sixty, and every one of the
  seven Democrats who negotiated the bill voted no — so a revival rebuilds the
  crossover bloc from zero rather than converting one or two holdouts. The
  calendar then closes: recess from October 5, and a November 5 to December 18
  lame duck already consumed by government funding. Meanwhile the SEC moved
  administratively on September 17, which removes much of the industry's reason
  to spend scarce floor time on the statute. Fair value on Yes is low single
  digits against 7.55c offered. The edge, if any, is on No as short-dated
  carry, not on Yes as a lottery ticket.

catalyst: >-
  Absence of a catalyst is the thesis: each week without floor action decays
  Yes toward zero. The live procedural hook is Senator Tillis's motion to
  reconsider, which leaves the bill on the calendar and lets Thune re-run the
  vote the day sixty votes exist.
catalyst_at: 2026-12-31T21:00:00-08:00

invalidation: >-
  Thune calling up the motion to reconsider with a whip count in hand, or the
  text attached to the year-end funding vehicle. Either reprices No violently
  and the carry is not worth defending — exit, do not average. Second, slower
  invalidation per Jev: No drifting to 97-98c, at which point the remaining
  premium no longer compensates the tail and the position is finished rather
  than wrong.

