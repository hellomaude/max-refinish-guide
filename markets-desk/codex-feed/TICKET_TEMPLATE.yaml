# Copy to tickets/<date>-<ID>-<slug>.ticket.yaml and fill in.
# `python -m desk validate` will tell you what is missing, in words.

schema_version: 2
id: WKND-000
created_at: 2026-09-21T06:30:00-07:00   # timezone required
source_seats: [Chain]                    # every seat that contributed

instrument:
  kind: equity            # equity | etf | crypto_spot | crypto_perp | option | prediction_market
  symbol: COIN
  venue: equity           # must be armed in MODE.yaml or the ticket is refused
  outcome: ""             # required for prediction_market: "Yes" / "No"

direction: long           # long | short
theme: crypto_policy_beta # informational; MODE.yaml membership is what binds

thesis: >-
  What is true, why it is not already priced, and what the other side believes.
  Too short and the contract refuses it, on the grounds that a thesis you can
  fit in six words is a hunch.

catalyst: What forces the repricing, and when.
catalyst_at: 2026-09-23T06:45:00-07:00   # optional

invalidation: >-
  The observation that makes this wrong. Not a price you would dislike — a fact
  that would retire the thesis.

horizon: intraday         # intraday | overnight | swing | position
size_hint_pct: 0.5        # what you are asking for; Rails only ever reduces it
confidence: 3             # 1-5, and 1 means "this is research, not a position"

entry: 100.0              # required with `stop` unless defined_risk
stop: 95.0                # must sit on the losing side of entry
defined_risk: false       # true for options and prediction markets

evidence:
  # `as_of` is when the fact was true, not when you fetched it. This is the
  # field that catches a feed serving last Friday's numbers.
  - key: spot
    kind: price           # see staleness_hours in MODE.yaml
    value: 81300
    source: Kraken public ticker
    as_of: 2026-09-21T06:25:00-07:00
    url: https://api.kraken.com/0/public/Ticker?pair=XBTUSD

sources:
  - https://primary-source.example/document

rails_check: pending      # pass | fail | pending
max_gate: true            # always

notes: >-
  Anything Rails or Codex needs that is not thesis: an exit rule, a resolution
  wording to confirm, a dependency on another seat.
